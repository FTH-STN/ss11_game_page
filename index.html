<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Just A Game</title>
<style>
  body { font-family: Arial; background: #f5f5f5; margin: 0; padding: 20px; }
  #loginBox, #chatUI { background: white; padding: 20px; border-radius: 8px; max-width: 900px; margin: auto; }

  /* Layout: announcement + chat side by side */
  #mainLayout {
    display: flex;
    gap: 20px;
  }
  
  #announcementBox {
    width: 30%;
    background:#fff3cd;
    padding:10px;
    border-radius:8px;
    height: 640px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
  }
  #announcementBox h3 { margin: 0 0 10px; }
  #announcementInput { flex: 1; width: 100%; box-sizing: border-box; resize: none; }
  #saveAnnouncementBtn { margin-top: 10px; align-self: flex-start; }

  #chatArea {
    width: 70%;
  }

  #chatBox {
    background: #fafafa;
    padding: 10px;
    border-radius: 8px;
    height: 580px;
    overflow-y: auto;
  }

  #userList {
    background: #e8f0fe;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 10px;
    font-size: 14px;
  }

  .msgLeft {
    text-align: left;
    background: #e0e0e0;
    padding: 8px;
    border-radius: 8px;
    max-width: 70%;
    margin-bottom: 10px;
  }
  .msgRight {
    text-align: right;
    background: #cce5ff;
    padding: 8px;
    border-radius: 8px;
    max-width: 70%;
    margin-left: auto;
    margin-bottom: 10px;
  }

  img { max-width: 200px; margin-top: 5px; border-radius: 6px; }

  #msgInput { width: 70%; padding: 8px; }
  #errorMsg { color: red; margin-top: 10px; }
  #leaveBtn { background: #c00; color: white; padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; }
</style>
</head>
<body>

<div id="loginBox">
  <h2>进入游戏</h2>
  <input type="text" id="usernameInput" placeholder="Your name"><br><br>
  <input type="password" id="passwordInput" placeholder="Password"><br><br>
  <button id="enterBtn">Enter</button>
  <div id="errorMsg"></div>
</div>

<div id="chatUI" style="display:none;">
  <h2>11性奴调教游戏</h2>

  <div id="mainLayout">
    <!-- Announcement panel -->
    <div id="announcementBox">
      <h3>公告栏</h3>
      <textarea id="announcementInput"></textarea>
      <button id="saveAnnouncementBtn">保存</button>
    </div>

    <!-- Chat area -->
    <div id="chatArea">
      <div id="userList">在线用户: (none)</div>
      <div id="chatBox"></div>

      <br>
      <input type="text" id="msgInput" placeholder="Type a message">
      <button id="sendBtn">发送消息</button>
      <br><br>

      <input type="file" id="imageInput" accept="image/*">
      <button id="sendImageBtn">发送图片</button>

      <br><br>
      <button id="leaveBtn">离开游戏</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://jqlvlpfpzmmrfrqqpima.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Hu6uBt2LVR3dGNJtoDtD_g_kYIXbDhw";

  function getDateKey() {
  const d = new Date();
  return d.getFullYear() + "-" +
         String(d.getMonth()+1).padStart(2,"0") + "-" +
         String(d.getDate()).padStart(2,"0");
}


const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

const cloudName = "ofsvu4f8";
const uploadPreset = "chat_uploads";

async function uploadImageToCloudinary(file) {
  const url = `https://api.cloudinary.com/v1_1/${cloudName}/image/upload`;
  const formData = new FormData();
  formData.append("file", file);
  formData.append("upload_preset", uploadPreset);
  const response = await fetch(url, { method: "POST", body: formData });
  const data = await response.json();
  return data.secure_url;
}

let username = "";
const PASSWORD = "HEchoNG11";
let heartbeatInterval = null;
let cleanupInterval = null;

// Generous timeout: background tabs throttle timers
const USER_TIMEOUT = 90000;

function beat() {
  if (!username) return;
  sb.from("active_users").upsert({ username: username, last_seen: Date.now() })
    .then(({ error }) => { if (error) console.error(error); });
}

function startHeartbeat() {
  heartbeatInterval = setInterval(beat, 5000);

  cleanupInterval = setInterval(() => {
    sb.from("active_users").delete().lt("last_seen", Date.now() - USER_TIMEOUT).then(() => {});
  }, 30000);
}

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) beat();
});

function stopHeartbeat() {
  clearInterval(heartbeatInterval);
  clearInterval(cleanupInterval);
}

function tryLogin() {
  const name = document.getElementById("usernameInput").value.trim();
  const pw = document.getElementById("passwordInput").value.trim();

  if (!name) {
    document.getElementById("errorMsg").innerText = "Please enter a name.";
    return;
  }
  if (pw !== PASSWORD) {
    document.getElementById("errorMsg").innerText = "Incorrect password.";
    return;
  }

  username = name;

  sb.from("active_users").upsert({ username: username, last_seen: Date.now() }).then(refreshUsers);
  document.getElementById("chatBox").innerHTML = "";
  renderedIds.clear();
  // Skip history: only show messages sent after this login
  sb.from("messages").select("id").order("id", { ascending: false }).limit(1)
    .then(({ data }) => {
      minId = data && data.length ? data[0].id : 0;
      loadMessages();
    });
  startHeartbeat();

  document.getElementById("loginBox").style.display = "none";
  document.getElementById("chatUI").style.display = "block";
}

document.getElementById("enterBtn").onclick = tryLogin;
document.getElementById("passwordInput").addEventListener("keydown", e => {
  if (e.key === "Enter") tryLogin();
});

document.getElementById("leaveBtn").onclick = () => {
  sb.from("active_users").delete().eq("username", username).then(refreshUsers);
  stopHeartbeat();

  document.getElementById("chatUI").style.display = "none";
  document.getElementById("loginBox").style.display = "block";
  document.getElementById("usernameInput").value = "";
  document.getElementById("passwordInput").value = "";
  document.getElementById("chatBox").innerHTML = "";
  username = "";
  minId = Infinity;
};

async function refreshUsers() {
  const { data } = await sb.from("active_users").select("username,last_seen")
    .gt("last_seen", Date.now() - USER_TIMEOUT).order("username");
  const userListDiv = document.getElementById("userList");
  if (!data || data.length === 0) {
    userListDiv.innerText = "在线用户: (none)";
    return;
  }
  userListDiv.innerText = "在线用户: " + data.map(r => r.username).join(", ");
}
refreshUsers();
sb.channel("active_users_ch")
  .on("postgres_changes", { event: "*", schema: "public", table: "active_users" }, refreshUsers)
  .subscribe();

window.addEventListener("beforeunload", () => {
  if (username) {
    fetch(`${SUPABASE_URL}/rest/v1/active_users?username=eq.${encodeURIComponent(username)}`, {
      method: "DELETE",
      keepalive: true,
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY }
    });
  }
});

function sendTextMessage() {
  const text = document.getElementById("msgInput").value.trim();
  if (!text || !username) return;

  sb.from("messages").insert({
    date_key: getDateKey(),
    username: username,
    text: text,
    time: Date.now()
  }).then(({ error }) => {
    if (error) console.error(error);
    loadMessages();
  });

  document.getElementById("msgInput").value = "";
}

document.getElementById("sendBtn").onclick = sendTextMessage;
document.getElementById("msgInput").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendTextMessage();
  }
});

document.getElementById("sendImageBtn").onclick = async () => {
  const file = document.getElementById("imageInput").files[0];
  if (!file || !username) return;

  const imageUrl = await uploadImageToCloudinary(file);
  if (!imageUrl) {
    alert("Image upload failed");
    return;
  }

  const { error } = await sb.from("messages").insert({
    date_key: getDateKey(),
    username: username,
    image_url: imageUrl,
    time: Date.now()
  });
  if (error) {
    console.error(error);
    alert("Failed to send image: " + error.message);
  }
  loadMessages();

  document.getElementById("imageInput").value = "";
};

const renderedIds = new Set();
let minId = Infinity;

function renderMessage(m) {
  if (!username || m.id <= minId || renderedIds.has(m.id)) return;
  renderedIds.add(m.id);

  const chatBox = document.getElementById("chatBox");
  const bubbleClass = m.username === username ? "msgRight" : "msgLeft";
  const msgId = "msg_" + m.id;

  let html = `<div id="${msgId}" class="${bubbleClass}">
                <strong>${escapeHtml(m.username)}</strong><br>`;
  if (m.text) html += escapeHtml(m.text);
  if (m.image_url) html += `<br><img src="${escapeHtml(m.image_url)}">`;
  html += `</div>`;

  chatBox.insertAdjacentHTML("beforeend", html);
  chatBox.scrollTop = chatBox.scrollHeight;

  // Remove image after 1 minute
  if (m.image_url) {
    setTimeout(() => {
      const img = document.querySelector("#" + msgId + " img");
      if (img) img.remove();
    }, 60000);
  }
}

async function loadMessages() {
  if (minId === Infinity) return;
  const { data } = await sb.from("messages").select("*")
    .eq("date_key", getDateKey()).gt("id", minId).order("id", { ascending: true });
  (data || []).forEach(renderMessage);
}

sb.channel("messages_ch")
  .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" }, payload => {
    if (payload.new.date_key === getDateKey()) renderMessage(payload.new);
  })
  .subscribe();

// Polling fallback in case realtime isn't enabled
setInterval(() => {
  if (username) loadMessages();
  refreshUsers();
}, 2000);

// Announcement: load and save
async function loadAnnouncement() {
  const { data } = await sb.from("announcement").select("text")
    .order("id", { ascending: false }).limit(1);
  document.getElementById("announcementInput").value = (data && data[0] && data[0].text) || "";
}
loadAnnouncement();
sb.channel("announcement_ch")
  .on("postgres_changes", { event: "INSERT", schema: "public", table: "announcement" }, payload => {
    document.getElementById("announcementInput").value = payload.new.text || "";
  })
  .subscribe();

document.getElementById("saveAnnouncementBtn").onclick = () => {
  const text = document.getElementById("announcementInput").value.trim();
  sb.from("announcement").insert({ text: text, time: Date.now() })
    .then(({ error }) => { if (error) console.error(error); });
};
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Just A Game</title>
<style>
  body { font-family: Arial; background: #f5f5f5; margin: 0; padding: 20px; }
  #loginBox, #chatUI { background: white; padding: 20px; border-radius: 8px; max-width: 900px; margin: auto; }

  /* Layout: announcement + chat side by side */
  #mainLayout {
    display: flex;
    gap: 20px;
  }

  #announcementBox {
    width: 30%;
    background:#fff3cd;
    padding:10px;
    border-radius:8px;
    height: 520px;
    box-sizing: border-box;
  }

  #chatArea {
    width: 70%;
  }

  #chatBox {
    background: #fafafa;
    padding: 10px;
    border-radius: 8px;
    height: 520px;   /* taller chat window */
    overflow-y: auto;
  }

  #userList {
    background: #e8f0fe;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 10px;
    font-size: 14px;
  }

  .msgLeft {
    text-align: left;
    background: #e0e0e0;
    padding: 8px;
    border-radius: 8px;
    max-width: 70%;
    margin-bottom: 10px;
  }
  .msgRight {
    text-align: right;
    background: #cce5ff;
    padding: 8px;
    border-radius: 8px;
    max-width: 70%;
    margin-left: auto;
    margin-bottom: 10px;
  }

  img { max-width: 200px; margin-top: 5px; border-radius: 6px; }

  #msgInput { width: 70%; padding: 8px; }
  #errorMsg { color: red; margin-top: 10px; }
  #leaveBtn { background: #c00; color: white; padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; }
</style>
</head>
<body>

<div id="loginBox">
  <h2>进入游戏</h2>
  <input type="text" id="usernameInput" placeholder="Your name"><br><br>
  <input type="password" id="passwordInput" placeholder="Password"><br><br>
  <button id="enterBtn">Enter</button>
  <div id="errorMsg"></div>
</div>

<div id="chatUI" style="display:none;">
  <h2>11性奴调教游戏</h2>

  <div id="mainLayout">
    <!-- Announcement panel -->
    <div id="announcementBox">
      <h3>公告栏</h3>
      <textarea id="announcementInput" style="width:100%; height:120px;"></textarea>
      <br><br>
      <button id="saveAnnouncementBtn">保存</button>
    </div>

    <!-- Chat area -->
    <div id="chatArea">
      <div id="userList">在线用户: (none)</div>
      <div id="chatBox"></div>

      <br>
      <input type="text" id="msgInput" placeholder="Type a message">
      <button id="sendBtn">发送消息</button>
      <br><br>

      <input type="file" id="imageInput" accept="image/*">
      <button id="sendImageBtn">发送图片</button>

      <br><br>
      <button id="leaveBtn">离开游戏</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAI9oPOuv9QXzzkGiMdt2NBbaShYEklRGo",
  authDomain: "ss11game.firebaseapp.com",
  databaseURL: "https://ss11game-default-rtdb.firebaseio.com",
  projectId: "ss11game",
  storageBucket: "ss11game.appspot.com",
  messagingSenderId: "454745281279",
  appId: "1:454745281279:web:88d734303160dfab0e72ca"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const cloudName = "ofsvu4f8";
const uploadPreset = "chat_uploads";

async function uploadImageToCloudinary(file) {
  const url = `https://api.cloudinary.com/v1_1/${cloudName}/image/upload`;
  const formData = new FormData();
  formData.append("file", file);
  formData.append("upload_preset", uploadPreset);
  const response = await fetch(url, { method: "POST", body: formData });
  const data = await response.json();
  return data.secure_url;
}

let username = "";
const PASSWORD = "HEchoNG11";
let heartbeatInterval = null;
let cleanupInterval = null;

function startHeartbeat() {
  heartbeatInterval = setInterval(() => {
    if (!username) return;
    db.ref("activeUsers/" + username).update({
      alive: true,
      lastSeen: Date.now()
    });
  }, 5000);

  cleanupInterval = setInterval(() => {
    db.ref("activeUsers").once("value", snapshot => {
      const users = snapshot.val();
      if (!users) {
        db.ref("messages").remove();
        return;
      }

      const now = Date.now();
      const TIMEOUT = 15000;

      Object.keys(users).forEach(u => {
        if (!users[u].lastSeen || now - users[u].lastSeen > TIMEOUT) {
          db.ref("activeUsers/" + u).remove();
        }
      });

      db.ref("activeUsers").once("value", snap2 => {
        if (!snap2.exists()) {
          db.ref("messages").remove();
        }
      });
    });
  }, 10000);
}

function stopHeartbeat() {
  clearInterval(heartbeatInterval);
  clearInterval(cleanupInterval);
}

function tryLogin() {
  const name = document.getElementById("usernameInput").value.trim();
  const pw = document.getElementById("passwordInput").value.trim();

  if (!name) {
    document.getElementById("errorMsg").innerText = "Please enter a name.";
    return;
  }
  if (pw !== PASSWORD) {
    document.getElementById("errorMsg").innerText = "Incorrect password.";
    return;
  }

  username = name;

  const userRef = db.ref("activeUsers/" + username);

  userRef.set({
    alive: true,
    lastSeen: Date.now()
  });

  userRef.onDisconnect().remove();

  db.ref("activeUsers").once("value", snapshot => {
    const users = snapshot.val();
    if (users && Object.keys(users).length === 1) {
      db.ref("messages").remove();
    }
  });

  document.getElementById("chatBox").innerHTML = "";
  startHeartbeat();

  document.getElementById("loginBox").style.display = "none";
  document.getElementById("chatUI").style.display = "block";
}

document.getElementById("enterBtn").onclick = tryLogin;
document.getElementById("passwordInput").addEventListener("keydown", e => {
  if (e.key === "Enter") tryLogin();
});

document.getElementById("leaveBtn").onclick = () => {
  db.ref("activeUsers/" + username).remove();
  stopHeartbeat();

  db.ref("activeUsers").once("value", snapshot => {
    if (!snapshot.exists()) db.ref("messages").remove();
  });

  document.getElementById("chatUI").style.display = "none";
  document.getElementById("loginBox").style.display = "block";
  document.getElementById("usernameInput").value = "";
  document.getElementById("passwordInput").value = "";
  document.getElementById("chatBox").innerHTML = "";
  username = "";
};

db.ref("activeUsers").on("value", snapshot => {
  const userListDiv = document.getElementById("userList");
  if (!snapshot.exists()) {
    userListDiv.innerText = "在线用户: (none)";
    return;
  }
  const users = Object.keys(snapshot.val());
  userListDiv.innerText = "在线用户: " + users.join(", ");
});

function sendTextMessage() {
  const text = document.getElementById("msgInput").value.trim();
  if (!text || !username) return;

  db.ref("messages").push({
    user: username,
    text: text,
    time: Date.now()
  });

  document.getElementById("msgInput").value = "";
}

document.getElementById("sendBtn").onclick = sendTextMessage;
document.getElementById("msgInput").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendTextMessage();
  }
});

document.getElementById("sendImageBtn").onclick = async () => {
  const file = document.getElementById("imageInput").files[0];
  if (!file || !username) return;

  const imageUrl = await uploadImageToCloudinary(file);

  db.ref("messages").push({
    user: username,
    imageUrl: imageUrl,
    time: Date.now()
  });

  document.getElementById("imageInput").value = "";
};

db.ref("messages").on("child_added", snapshot => {
  const msg = snapshot.val();
  const chatBox = document.getElementById("chatBox");

  const isMe = msg.user === username;
  const bubbleClass = isMe ? "msgRight" : "msgLeft";

  // Create message container with unique ID
  const msgId = "msg_" + snapshot.key;
  let html = `<div id="${msgId}" class="${bubbleClass}">
                <strong>${msg.user}</strong><br>`;

  if (msg.text) html += msg.text;

  // Show image immediately
  if (msg.imageUrl) {
    html += `<br><img src="${msg.imageUrl}">`;
  }

  html += `</div>`;

  chatBox.innerHTML += html;
  chatBox.scrollTop = chatBox.scrollHeight;

  // ⭐ Remove image after 1 minute
  if (msg.imageUrl) {
    setTimeout(() => {
      const div = document.getElementById(msgId);
      if (div) {
        // Remove only the <img>, keep the message bubble
        const img = div.querySelector("img");
        if (img) img.remove();
      }
    }, 60000); // 60,000 ms = 1 minute
  }
});


// Announcement: load and save
db.ref("announcement").on("value", snapshot => {
  const text = snapshot.val() || "";
  document.getElementById("announcementInput").value = text;
});

document.getElementById("saveAnnouncementBtn").onclick = () => {
  const text = document.getElementById("announcementInput").value.trim();
  db.ref("announcement").set(text);
};
</script>

</body>
</html>
